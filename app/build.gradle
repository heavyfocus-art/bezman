plugins {
    id 'com.android.application'
}

def runNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.heavyfocus.bezman'
    compileSdk 36

    defaultConfig {
        applicationId 'com.heavyfocus.bezman'
        minSdk 26
        targetSdk 36
        versionCode runNum
        versionName "1.${runNum}"
    }

    signingConfigs {
        // The APK people install by hand (keeps working with the copies already installed).
        release {
            storeFile file('bezman.keystore')
            storeType 'pkcs12'
            storePassword 'bezman2026'
            keyAlias 'bezman'
            keyPassword 'bezman2026'
        }
        // The private upload key for Google Play (kept in GitHub secrets, never in the code).
        upload {
            def ks = System.getenv("UPLOAD_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storeType 'pkcs12'
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias 'upload'
                keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig project.hasProperty('forPlay') ? signingConfigs.upload : signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
