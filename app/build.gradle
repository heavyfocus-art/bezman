plugins {
    id 'com.android.application'
}

def runNum = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.heavyfocus.bezman'
    compileSdk 34

    defaultConfig {
        applicationId 'com.heavyfocus.bezman'
        minSdk 26
        targetSdk 34
        versionCode runNum
        versionName "1.${runNum}"
    }

    signingConfigs {
        release {
            storeFile file('bezman.keystore')
            storeType 'pkcs12'
            storePassword 'bezman2026'
            keyAlias 'bezman'
            keyPassword 'bezman2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
